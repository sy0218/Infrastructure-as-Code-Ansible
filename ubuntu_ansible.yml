# =====================================================
# Control Node
# =====================================================
- name: "[ Setup Control Node.. ]"
  hosts: localhost
  become: true
  gather_facts: false

  roles:
    - control

# =====================================================
# Ubuntu Servers
# =====================================================
- name: "[ Ubuntu_Servers Settings.. ]"
  hosts: Ubuntu_Servers
  become: true
  gather_facts: false

  roles:
    - root_password
    - packages
    - pip_packages
    - nicname
    - cloud_init
    - ufw
    - locale_ko
    - ssh_root_login
    - timezone
    - ntp
    - open_files
    - logrotate
    - shell_default
    - java
    #    - disable_swap
    - enable_swap
    - package_version_lock
    - package_update_lock
    - bash_common
    - ssh_keygen
    # 이 롤만 태그를 갖는 이유: /etc/hosts 는 인그레스 전환·노드 IP 변경 때 단독으로
    # 다시 돌려야 하는데, 태그가 없으면 롤 20개 전체를 재실행하는 것이 유일한 경로다.
    #   ansible-playbook ubuntu_ansible.yml --tags etc_hosts
    - { role: etc_hosts, tags: ['etc_hosts'] }
