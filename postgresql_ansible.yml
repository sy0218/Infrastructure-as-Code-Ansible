# =====================================================
# PostgreSQL 설치 (TimescaleDB 내장, 로컬 이관)
# =====================================================
# ADR 0 (Kafka)의 판단을 데이터 스토어에도 적용한다 — K8s 가 아니라 서버 로컬(systemd).
# Terraform 300-data-layer-base 의 postgres_host 가 여기서 설치한 주소를 가리키며,
# 304-airflow 는 이 인스턴스가 떠 있어야 init Job 이 통과한다.
#
# ⚠ 계정·DB 이름이 곧 계약이다 — postgres_superuser 는 Terraform 300/303 의
#   secrets.auto.tfvars 와 글자 그대로 같아야 한다.
# =====================================================
- name: "[ PostgreSQL Setup.. ]"
  hosts: postgres
  become: true
  gather_facts: false

  roles:
    - postgres # postgresql-16 + TimescaleDB 설치 + DB 3종/스키마/하이퍼테이블 부트스트랩
