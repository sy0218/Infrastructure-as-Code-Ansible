# -----------------------------------------------------
# 로컬 작업 저장소 부트스트랩 (git init → .gitignore → remote → 최초 push)
# -----------------------------------------------------
#
# 이 롤이 하는 일은 '한 번 만들어 주는 것'까지다. 이후의 수정→커밋→push 는 사람이 한다.
# → 커밋이 이미 하나라도 있으면 8~9번(최초 커밋·push)을 건너뛴다. 그렇게 하지 않으면
#   Ansible 을 돌릴 때마다 작업 중이던 변경분이 임의의 메시지로 커밋되어 이력이 오염된다.
#
# 짝이 되는 서버 쪽(bare 저장소)은 Terraform 303-git 의 initContainer 가 만든다.
# 이 롤은 그 저장소를 가리키는 '클라이언트'만 준비한다.

# 1. git 설치 (Ubuntu 기본 이미지엔 없을 수 있다)
- name: "Install git"
  apt:
    name: git
    state: present
    update_cache: false

# 2. 소스 트리 확인 — 이 롤은 원본이 있는 노드에서만 의미가 있다.
#    없는 노드에서 조용히 빈 저장소를 만들면 '내용 없는 origin' 을 push 하게 되므로
#    여기서 명확히 실패시킨다.
- name: "Check source tree exists"
  stat:
    path: "{{ local_git_repo_dir }}"
  register: local_git_dir_stat

- name: "Fail when source tree is missing"
  fail:
    msg: "{{ local_git_repo_dir }} 가 없다 — 이 롤은 data_pipeline 소스 트리를 가진 노드에서만 돈다."
  when: not (local_git_dir_stat.stat.isdir | default(false))

# 3. ⚠ 선행 조건 검사 — 여기가 이 롤의 순서상 특이점이다.
#    저장소를 '만드는' 일은 클러스터와 무관하지만 '밀어 넣는' 일은 그렇지 않다.
#    push 대상이 Terraform 303-git 의 파드라서, 이 플레이북은 노드 준비 단계가 아니라
#    303 apply 와 304 apply 사이에 끼어든다(README 적용 순서 참조).
#    반쯤 진행된 뒤 push 에서 죽으면 원인을 찾기 어려우므로 맨 앞에서 끊는다.
- name: "Check remote repository is reachable"
  command:
    cmd: "git ls-remote --heads {{ local_git_remote_url }}"
  register: local_git_reachable
  failed_when: false
  changed_when: false

- name: "Fail when remote is unreachable"
  fail:
    msg: |
      {{ local_git_remote_url }} 에 붙지 못했다. 둘 중 하나다.
        1) Terraform 303-git 이 아직 apply 되지 않았다(파드 Running 확인:
           kubectl get pods -n data-layer -l app=data-layer-git)
        2) /etc/hosts 에 data-layer-git 이 없다(etc_hosts 롤을 먼저 돌릴 것)
  when: local_git_reachable.rc != 0

# 4. 저장소 초기화 (creates 로 멱등 — .git 이 있으면 건너뛴다)
#    -b 로 브랜치 이름을 못박는 이유: git 기본 브랜치 이름은 버전·설정마다 달라지는데
#    이 값이 304-airflow 의 git_ref 와 어긋나면 git-sync 가 ref 를 못 찾아 파드가 init 에서 멈춘다.
- name: "Initialize working repository"
  command:
    cmd: "git init -q -b {{ local_git_branch }}"
    chdir: "{{ local_git_repo_dir }}"
    creates: "{{ local_git_repo_dir }}/.git"

# 5. .gitignore (copy: content 자체가 멱등 — 내용이 같으면 changed=0)
#    ⚠ airflow.env 와 scripts/airflow.conf 는 반드시 제외 대상이다. 비밀번호·fernet 키·
#      JWT 시크릿·COLLECTOR_CRYPTO_KEY 가 들어 있고, 런타임 값은 어차피 Secret airflow-env
#      에서 오므로 저장소에 있을 이유가 없다.
- name: "Write .gitignore"
  copy:
    dest: "{{ local_git_repo_dir }}/.gitignore"
    owner: root
    group: root
    mode: '0644'
    content: |
      {% for pattern in local_git_ignore %}
      {{ pattern }}
      {% endfor %}

# 6. 커밋 아이덴티티 — 저장소 로컬로만 박는다(--global 을 쓰면 노드 전역 설정을 건드린다)
- name: "Set repository-local commit identity"
  command:
    cmd: "git config {{ item.key }} {{ item.value }}"
    chdir: "{{ local_git_repo_dir }}"
  loop:
    - { key: "user.name", value: "{{ local_git_user_name }}" }
    - { key: "user.email", value: "{{ local_git_user_email }}" }
  changed_when: false

# 7. origin 설정 — 없으면 add, 있으면 주소가 다를 때만 set-url
- name: "Read current origin url"
  command:
    cmd: "git remote get-url origin"
    chdir: "{{ local_git_repo_dir }}"
  register: local_git_origin
  failed_when: false
  changed_when: false

- name: "Configure origin"
  command:
    cmd: "git remote {{ 'set-url' if local_git_origin.rc == 0 else 'add' }} origin {{ local_git_remote_url }}"
    chdir: "{{ local_git_repo_dir }}"
  when: local_git_origin.rc != 0 or local_git_origin.stdout | trim != local_git_remote_url

# 8. 최초 커밋 — 커밋이 하나도 없을 때만(= 부트스트랩)
- name: "Check for existing commits"
  command:
    cmd: "git rev-parse --verify HEAD"
    chdir: "{{ local_git_repo_dir }}"
  register: local_git_head
  failed_when: false
  changed_when: false

- name: "Create initial commit"
  shell: "git add -A && git commit -q -m '{{ local_git_initial_message }}'"
  args:
    chdir: "{{ local_git_repo_dir }}"
  when: local_git_head.rc != 0

# 9. 최초 push — 서버 저장소가 비어 있을 때를 전제로 한다.
- name: "Push initial commit"
  command:
    cmd: "git push -u origin {{ local_git_branch }}"
    chdir: "{{ local_git_repo_dir }}"
  when: local_git_head.rc != 0

# 10. 검증 — 로컬 상태만 보면 push 성공을 알 수 없다. 서버 쪽 ref 로 확인한다.
- name: "Check remote ref"
  command:
    cmd: "git ls-remote --heads {{ local_git_remote_url }} {{ local_git_branch }}"
    chdir: "{{ local_git_repo_dir }}"
  register: local_git_remote_ref
  changed_when: false

- name: "Check tracked secrets"
  command:
    cmd: "git ls-files"
    chdir: "{{ local_git_repo_dir }}"
  register: local_git_tracked
  changed_when: false

- name: "Assert repository bootstrapped and secrets excluded"
  assert:
    that:
      - local_git_remote_ref.stdout | trim != "" # 서버에 브랜치가 실재
      - "'airflow.env' not in local_git_tracked.stdout_lines" # 비밀값 미추적
      - "'scripts/airflow.conf' not in local_git_tracked.stdout_lines"
      - "'dags/collector_dag.py' in local_git_tracked.stdout_lines" # 실제 코드는 추적
    success_msg: "Good!.. | {{ local_git_branch }} pushed ({{ local_git_tracked.stdout_lines | length }} files, secrets excluded)"
    fail_msg: "ERROR!.. | push 실패 또는 비밀 파일이 추적되고 있음"
