# -----------------------------------------------------
# MinIO 설치 → 단일 노드 단일 디스크(SNSD) + mc 로 버킷 프로비저닝
# -----------------------------------------------------
# ADR 0 (Kafka)와 같은 판단 — K8s 가 아니라 서버 로컬(systemd).
#   compose 시절엔 4노드 분산(MINIO_SERVER_ENDPOINTS)이었지만 로컬 이관과 함께
#   단일 엔드포인트로 정리됐다(300-data-layer-base 의 minio_endpoint 가 그 주소).
# 이 롤이 compose 의 minio + minio-init 두 서비스를 대체한다:
#   버킷 생성(config/warehouse/airflow-logs) + 시드 주입(config/schemas/debezium)
#
# [주의] SNSD 는 이레이저 코딩이 없다 — 디스크가 죽으면 오브젝트가 사라진다.
#   랩 규모라 받아들인 트레이드오프이며, 늘리려면 노드/디스크를 추가하고
#   minio_volumes 를 다중 엔드포인트로 바꾸는 것이 정공법이다.
# -----------------------------------------------------

# =========================================================================
# 1. minio 전용 계정 생성 (user 모듈 자체가 멱등)
#    → 로그인 불가 계정 (/usr/sbin/nologin)
# =========================================================================
- name: "Create minio system user"
  user:
    name: "{{ minio_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# =========================================================================
# 2. 디렉토리 생성 (file 모듈 자체가 멱등)
#    → 데이터 디렉토리는 실행 계정 소유여야 한다(서버가 직접 쓴다)
# =========================================================================
- name: "Create minio directories"
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    mode: '0755'
  loop:
    - { path: "{{ minio_install_root }}", owner: root } # 바이너리 설치 루트
    - { path: "{{ minio_install_root }}/bin", owner: root } # minio / mc 실행 파일
    - { path: "{{ minio_data_dir }}", owner: "{{ minio_user }}" } # 오브젝트 데이터
    - { path: "{{ minio_seed_dir }}", owner: root } # 시드 스테이징(컨트롤 노드에서 복사)

# =========================================================================
# 3. minio 서버 바이너리 다운로드 (파일명에 버전 포함 → 버전 변경 시에만 새로 받음)
#    ⚠ latest 경로(.../linux-amd64/minio)를 쓰지 않는다 — 버전 고정 규칙 위반이고,
#      재실행마다 다른 바이너리가 내려와 멱등성이 깨진다.
#    ⚠ 최신 릴리스가 archive/ 에 아직 없을 수 있다 → 핀을 올릴 때 실존 확인 필수:
#      curl -sIL .../archive/minio.<태그> | head -1
# =========================================================================
- name: "Download minio server binary"
  get_url:
    url: "https://dl.min.io/server/minio/release/linux-amd64/archive/minio.{{ minio_version }}"
    dest: "{{ minio_install_root }}/bin/minio.{{ minio_version }}"
    owner: root
    group: root
    mode: '0755'
  register: minio_bin
  retries: 3 # 외부망 다운로드 불안정 대비
  delay: 10
  until: minio_bin is succeeded

# =========================================================================
# 4. mc 클라이언트 다운로드 (버킷 프로비저닝 + 검증에 쓴다)
# =========================================================================
- name: "Download minio client binary"
  get_url:
    url: "https://dl.min.io/client/mc/release/linux-amd64/archive/mc.{{ minio_mc_version }}"
    dest: "{{ minio_install_root }}/bin/mc.{{ minio_mc_version }}"
    owner: root
    group: root
    mode: '0755'
  register: mc_bin
  retries: 3
  delay: 10
  until: mc_bin is succeeded

# =========================================================================
# 5. 심볼릭 링크 (file 모듈 자체가 멱등 / 버전 변경 시 링크만 교체되어 롤백이 쉽다)
# =========================================================================
- name: "Link minio binaries to versioned files"
  file:
    src: "{{ minio_install_root }}/bin/{{ item.src }}"
    path: "{{ item.path }}"
    state: link
  loop:
    - { src: "minio.{{ minio_version }}", path: "{{ minio_install_root }}/bin/minio" }
    - { src: "mc.{{ minio_mc_version }}", path: "{{ minio_install_root }}/bin/mc" }
  notify: restart minio

# =========================================================================
# 6. 환경 파일 (copy 자체가 멱등)
#    → 자격증명이 systemd 유닛이 아니라 이 파일에만 있게 한다(유닛은 0644 로 읽힌다).
#    ⚠ MINIO_ROOT_USER/PASSWORD 는 Terraform 300-data-layer-base 의
#      minio_root_user / minio_root_password 와 반드시 같은 값이어야 한다.
# =========================================================================
- name: "Create minio environment file"
  copy:
    dest: /etc/default/minio
    owner: root
    group: "{{ minio_user }}"
    mode: '0640' # 자격증명 — 실행 계정만 읽는다
    content: |
      # Ansible minio 롤이 관리한다 — 수동 수정 금지
      MINIO_ROOT_USER={{ minio_root_user }}
      MINIO_ROOT_PASSWORD={{ minio_root_password }}
      MINIO_VOLUMES={{ minio_data_dir }}
      MINIO_OPTS=--address :{{ minio_api_port }} --console-address :{{ minio_console_port }}
  notify: restart minio

# =========================================================================
# 7. systemd 유닛 생성 (copy 자체가 멱등)
#    → 공식 유닛과 달리 ExecStartPre(볼륨 확인)를 두지 않는다 — 위 2번이 보장한다.
# =========================================================================
- name: "Create minio systemd unit"
  copy:
    dest: /etc/systemd/system/minio.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=MinIO Object Storage {{ minio_version }} (single-node single-disk)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User={{ minio_user }}
      Group={{ minio_user }}
      EnvironmentFile=/etc/default/minio
      # $MINIO_OPTS 는 의도적으로 따옴표 없이 둔다 — 셸 분할로 인자 2쌍이 전달돼야 한다
      ExecStart={{ minio_install_root }}/bin/minio server $MINIO_OPTS $MINIO_VOLUMES
      Restart=on-failure
      RestartSec=5
      # 오브젝트마다 파일을 연다 — 기본 1024 로는 부족
      LimitNOFILE=65536

      [Install]
      WantedBy=multi-user.target
  notify: restart minio

# =========================================================================
# 8. 포트 선점 확인 (조회만 / changed_when: false)
#    → 이미 minio 자신이 물고 있는 경우(재실행)는 정상이므로 MainPID 를 제외한다.
#      노드 포트를 직접 쓰기 때문에 kafka 롤과 같은 사고(9098 충돌) 재발을 막는다.
# =========================================================================
- name: "Get minio service main pid"
  command: systemctl show minio -p MainPID --value
  register: minio_mainpid
  changed_when: false
  failed_when: false # 최초 설치라 유닛이 아직 없을 수 있다

- name: "Check processes holding the minio ports"
  shell: "ss -lntpH 'sport = :{{ item }}' | grep -v 'pid={{ minio_mainpid.stdout | default('0', true) }},' || true"
  loop:
    - "{{ minio_api_port }}"
    - "{{ minio_console_port }}"
  register: minio_port_owner
  changed_when: false

- name: "Assert minio ports are not taken by another process"
  assert:
    that:
      - item.stdout | trim == "" # minio 외 점유자가 없어야 한다
    success_msg: "Good!.. | minio port available"
    fail_msg: "ERROR!.. | minio port taken by another process → {{ item.stdout }}"
  loop: "{{ minio_port_owner.results }}"
  loop_control:
    label: "{{ item.item }}"

# =========================================================================
# 9. 서비스 기동 + 부팅 자동시작 (systemd 모듈 자체가 멱등)
# =========================================================================
- name: "Enable and start minio"
  systemd:
    name: minio
    enabled: true
    state: started
    daemon_reload: true

# =========================================================================
# 10. 설정 변경분을 버킷 프로비저닝 전에 반영한다
# =========================================================================
- name: "Flush handlers before provisioning"
  meta: flush_handlers

# =========================================================================
# 11. 기동 대기 → live 프로브가 200 이 될 때까지
# =========================================================================
- name: "Wait for minio to become live"
  command: "curl -s -o /dev/null -w %{http_code} http://127.0.0.1:{{ minio_api_port }}/minio/health/live"
  register: minio_live
  changed_when: false
  retries: 12 # 최대 1분
  delay: 5
  until: minio_live.stdout == "200"

# =========================================================================
# 12. mc alias 등록 (--api S3v4 고정 / 자격증명은 환경변수로 넘겨 명령행에 남지 않게 한다)
# =========================================================================
- name: "Set mc alias"
  command: "{{ minio_install_root }}/bin/mc alias set {{ minio_mc_alias }} http://127.0.0.1:{{ minio_api_port }} {{ minio_root_user }} {{ minio_root_password }} --api S3v4"
  register: mc_alias
  changed_when: "'Added' in mc_alias.stdout"
  no_log: true # 자격증명이 인자로 들어간다 — 로그에 남기지 않는다

# =========================================================================
# 13. 버킷 생성 (--ignore-existing 로 멱등)
#     → config    : 도메인 설정/스키마/커넥터 JSON (CDM_OBJSTORE_BUCKET)
#     → warehouse : Iceberg 데이터 파일 (ICEBERG_WAREHOUSE)
#     → airflow-logs : Airflow 원격 로깅 대상 (304-airflow 의 airflow_logs_bucket)
#     ⚠ 버킷이 없으면 Airflow 태스크는 정상 종료해도 로그가 사라진다(업로드 실패는 태스크를 죽이지 않는다).
# =========================================================================
- name: "Create minio buckets"
  command: "{{ minio_install_root }}/bin/mc mb --ignore-existing {{ minio_mc_alias }}/{{ item }}"
  loop: "{{ minio_buckets }}"
  register: mc_mb
  changed_when: "'Bucket created' in mc_mb.stdout"

# =========================================================================
# 14. 시드 파일 스테이징 (copy 자체가 멱등 — 내용이 같으면 changed 안 남)
#     → compose 의 minio-init 이 마운트했던 3개 경로를 그대로 옮긴다.
#       컨트롤 노드의 data_pipeline 저장소가 원본이다(minio_seed_src).
# =========================================================================
- name: "Stage seed files"
  copy:
    src: "{{ minio_seed_src }}/{{ item.src }}/"
    dest: "{{ minio_seed_dir }}/{{ item.dest }}/"
    owner: root
    group: root
    mode: '0644'
  loop:
    - { src: config, dest: config } # 도메인 설정 config/*.yaml (utils/cdm_config.py 가 읽는다)
    - { src: schemas, dest: schemas } # Avro 스키마
    - { src: data_layer_debezium/connect_json, dest: debezium/connect_json } # CDC 커넥터 JSON
  loop_control:
    label: "{{ item.src }}"

# =========================================================================
# 15. 시드 주입 (mc mirror 는 변경분만 올린다 → 재실행이 안전하다)
#     → compose 의 `mc mirror /seed dl/config` 와 같은 결과: config 버킷 안에
#       config/ · schemas/ · debezium/connect_json/ 프리픽스가 생긴다.
# =========================================================================
- name: "Mirror seed files into config bucket"
  command: "{{ minio_install_root }}/bin/mc mirror --overwrite {{ minio_seed_dir }}/ {{ minio_mc_alias }}/{{ minio_config_bucket }}"
  register: mc_mirror
  changed_when: mc_mirror.stdout | trim != ""

# -----------------------------------------------------
# 검증
# -----------------------------------------------------
- name: "Check minio service status"
  command: systemctl is-active minio
  register: minio_status
  changed_when: false
  failed_when: false
  retries: 3
  delay: 5
  until: minio_status.stdout == "active"

- name: "Check installed minio version"
  command: "{{ minio_install_root }}/bin/minio --version"
  register: minio_version_check
  changed_when: false

- name: "List minio buckets"
  command: "{{ minio_install_root }}/bin/mc ls {{ minio_mc_alias }}"
  register: minio_bucket_list
  changed_when: false

- name: "List seeded config objects"
  command: "{{ minio_install_root }}/bin/mc ls --recursive {{ minio_mc_alias }}/{{ minio_config_bucket }}"
  register: minio_config_objects
  changed_when: false

# 클러스터 파드가 실제로 붙는 경로(노드 IP)로 확인한다 —
# 127.0.0.1 만 보면 0.0.0.0 바인드 실패를 못 잡는다.
- name: "Check minio api on node address"
  command: "curl -s -o /dev/null -w %{http_code} http://{{ ansible_host }}:{{ minio_api_port }}/minio/health/live"
  register: minio_remote
  changed_when: false
  failed_when: false

- name: "Assert minio is ready for the data layer"
  assert:
    that:
      - minio_status.stdout == "active"
      - minio_version in minio_version_check.stdout # 고정 버전 일치 (조건문 안에서는 {{ }} 금지)
      - item in minio_bucket_list.stdout # 버킷 3종 존재
      - minio_remote.stdout == "200" # 노드 IP 로도 응답
      - minio_config_objects.stdout | trim != "" # 시드가 실제로 올라갔다
    success_msg: "Good!.. | minio active — bucket exists: {{ item }} (seed OK, api :{{ minio_api_port }})"
    fail_msg: "ERROR!.. | minio NOT ready or bucket missing: {{ item }} → 노드에서 journalctl -u minio -n 50 확인 (포트 충돌 / MINIO_VOLUMES 권한 순으로 의심)"
  loop: "{{ minio_buckets }}"
