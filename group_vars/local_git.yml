#########################################
# Airflow 코드 저장소 부트스트랩 (local_git 사용)
# → 서버 쪽 bare 저장소는 Terraform 303-git 이 만든다. 여기는 클라이언트 쪽뿐이다.
# → 이 롤은 '한 번 만들어 주는 것'까지만 한다 — 커밋이 이미 있으면 건드리지 않는다.
#########################################
local_git_repo_dir: /my_project/data_pipeline/data_layer_airflow
# ⚠ 주소·브랜치는 Terraform 304-airflow 의 git_repo / git_ref 와 짝이다.
#   여기는 NodePort(바깥에서 push), 파드는 ClusterIP FQDN(안에서 clone) — 같은 저장소다.
local_git_remote_url: "git://data-layer-git:30418/airflow.git"
local_git_branch: master

local_git_user_name: ops
local_git_user_email: ops@data-layer

local_git_initial_message: "init: airflow DAG + 커스텀 패키지 (git-sync 원본)"

# ⚠ 앞의 두 줄은 비밀값이라 반드시 제외한다(비밀번호·fernet·JWT·CRYPTO_KEY).
#   런타임 값은 Secret airflow-env 에서 오므로 저장소에 없어도 동작한다.
local_git_ignore:
  - airflow.env
  - scripts/airflow.conf
  - logs/
  - __pycache__/
  - "*.pyc"
