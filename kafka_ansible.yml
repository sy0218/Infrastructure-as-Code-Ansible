# =====================================================
# Kafka 설치 (KRaft 로컬 클러스터)
# =====================================================
- name: "[ Kafka Setup ]"
  hosts: kafka
  become: true
  gather_facts: false

  roles:
    - { role: kafka, tags: ['kafka'] } # Kafka tarball 설치 + KRaft 3노드 구성 + systemd 기동 + JMX exporter

# =====================================================
# 토픽은 클러스터 전체에 반영되므로 한 노드(ap)에서만 생성한다
# (ap 는 kafka 그룹 멤버라 kafka 그룹 vars 를 그대로 상속받는다)
# =====================================================
- name: "[ Kafka Topics Setup.. ]"
  hosts: ap
  become: true
  gather_facts: false

  roles:
    - { role: kafka_topics, tags: ['kafka_topics'] } # 파이프라인 계약 토픽 생성(--if-not-exists) + 존재 검증
