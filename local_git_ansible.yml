# =====================================================
# 로컬 작업 저장소 부트스트랩 (Airflow 코드 → 클러스터 git)
#
# Airflow 파드에는 DAG·커스텀 패키지가 없다(Terraform 304-airflow 의 git-sync 가 받아 온다).
# 그 원본을 담는 '클라이언트 쪽' 저장소를 만들어 주는 것이 이 플레이북이다.
#   서버 쪽 bare 저장소 = Terraform 303-git 의 initContainer (여기 없음)
#   클라이언트 쪽       = 이 플레이북
#
# ⚠ 선행 조건 두 가지 — 없으면 최초 push 에서 멈춘다.
#   1) 303-git apply 완료(파드 Running) — 받아 줄 저장소가 있어야 한다
#   2) etc_hosts 롤 적용 — data-layer-git 이름이 풀려야 한다
#
# 한 번 만들고 나면 이후 수정은 사람이 한다(이 플레이북은 커밋이 이미 있으면 아무것도 하지 않는다):
#   cd /my_project/data_pipeline/data_layer_airflow && git add -A && git commit -m "..." && git push
# =====================================================
- name: "[ Local Git Repository Bootstrap.. ]"
  hosts: local_git
  become: true
  gather_facts: false

  roles:
    - local_git # git init + .gitignore + origin + 최초 커밋/push (부트스트랩 전용)
