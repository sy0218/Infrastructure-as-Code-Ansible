all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_become_password: "1234"
  children:
    Ubuntu_Servers:
      hosts:
        ap:
          ansible_host: 192.168.56.200
        s1:
          ansible_host: 192.168.56.201
        s2:
          ansible_host: 192.168.56.202

      vars:
        #########################################
        # Ansible 접속/권한 (모든 플레이 공통)
        #########################################
        ansible_user: jsy_project
        ansible_ssh_pass: "1234"
        ansible_become_password: "1234"

        #########################################
        # 루트 패스워드 설정 (root_password 사용)
        #########################################
        root_password: "1234"

        #########################################
        # data-layer 외부 접속용 DNS 이름 목록 (etc_hosts 사용)
        # → 왜 서비스마다 이름을 나눴나: 공유 이름 하나에 포트만 다르게 붙이면
        #   주소를 봐도 어느 서비스인지 알 수 없다. 이름을 나누면 data-layer-grafana 처럼
        #   주소 자체가 목적지를 설명해서, 무엇에 접속하는지 외우지 않아도 된다.
        # → 목록이 둘로 갈린 이유는 '장애 전환을 누가 하느냐'가 다르기 때문이다.
        #   두 방식은 섞을 수 없다 — 한 이름이 노드 IP 와 VIP 를 동시에 가지면 클라이언트가
        #   둘 중 아무 데나 붙어서 증상이 접속할 때마다 달라진다.
        # → 밑줄(data_layer_harbor)이 아니라 하이픈인 이유: DNS 호스트명 라벨에 밑줄을 쓸 수
        #   없다(RFC 1123). 특히 Harbor 는 치명적이다 — Docker 이미지 참조 파서의 domain 규칙이
        #   `[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?` 라 밑줄이 들어가면 이미지 주소로
        #   파싱조차 되지 않는다. .local 을 뗀 이유는 mDNS 예약 도메인(RFC 6762)이라
        #   systemd-resolved/Avahi 가 질의를 가로챌 수 있어서다.
        # → 이름을 바꾸거나 추가하면 Terraform 각 스택의 <앱>_host 기본값도 같이 바꿔야 한다.
        #########################################

        # ① 노드 IP 계열 — 이름 하나가 노드 IP 전부를 A 레코드로 갖는다(노드당 1줄).
        #   장애 전환은 클라이언트가 한다: 죽은 IP 로 먼저 붙으면 TCP 타임아웃을 기다린
        #   뒤에야 다음 IP 로 넘어간다(glibc 가 여러 주소를 반환하려면 /etc/host.conf 에
        #   'multi on' 이 필요 — Ubuntu 기본값이다).
        #   여기 남은 이유는 제각각이다:
        #     git     — git 프로토콜은 HTTP 가 아니라 Host 헤더가 없다(L7 라우팅 불가)
        #     minio-console·neo4j — K8s 밖 ap 노드의 systemd 서비스라 Service 객체가 없다
        data_layer_dns_names:
          - data-layer-git
          - data-layer-minio-console
          - data-layer-neo4j

        # ② VIP 계열 — 이름 전부가 인그레스 VIP 하나를 가리킨다(총 1줄).
        #   장애 전환은 MetalLB 가 한다: 노드가 죽으면 VIP 가 살아 있는 노드로 옮겨가므로
        #   클라이언트는 타임아웃을 기다릴 일이 없고 주소도 그대로다.
        #   이름별 구분은 hosts 가 아니라 인그레스가 Host 헤더로 한다.
        # ⚠ harbor 가 여기 있는 것이 특별하다 — 이 이름은 사람이 치는 주소일 뿐 아니라
        #   '이미지 이름의 첫 마디'(data-layer-harbor/data-layer/api:v0.1.0)라서,
        #   아래 containerd_insecure_registries 와 Terraform 전 스택의 harbor_registry 가
        #   이 문자열과 글자 그대로 같아야 한다.
        data_layer_vip_dns_names:
          - data-layer-harbor
          - data-layer-kafka-ui
          - data-layer-airflow
          - data-layer-api
          - data-layer-grafana
          - data-layer-prometheus

        #########################################
        # 인그레스 진입점 VIP (etc_hosts 사용)
        # → MetalLB 가 이 주소를 노드 한 대에 붙여 두고, 그 노드가 죽으면 다른 노드로 옮긴다.
        # ⚠ Terraform 102-ingress 의 ingress_vip · 305-api 의 ingress_vip 와 글자 그대로
        #   같아야 한다. 노드망(192.168.56.0/24) 안이면서 노드 IP·DHCP 대역과 겹치면 안 된다
        #   — L2 모드는 같은 브로드캐스트 도메인에서 ARP 로 광고하는 방식이다.
        #########################################
        ingress_vip: 192.168.56.240

        #########################################
        # 설치할 기본 패키지 목록 (packages 사용)
        #########################################
        install_packages:
          - net-tools
          - python3-pip
          - jq
          - apt-transport-https
          - wget
          - curl
          - unzip
          - python3-debian # deb822_repository 모듈 의존성 (k8s_packages 롤)
          - bash-completion # 탭 완성 — 로그인 셸은 패키지가, 비로그인 셸은 bash_common 롤이 켠다

        #########################################
        # 설치할 Python 패키지 목록 (pip_packages 사용)
        #########################################
        pip_packages:
          - docker==7.1.0

        #########################################
        # logrotate 기본 설정 (logrotate 사용)
        # → regexp: 치환 대상 라인, line: 적용 값
        #########################################
        logrotate_options:
          - { regexp: '^(daily|weekly|monthly|yearly)$', line: 'weekly' } # 회전 주기
          - { regexp: '^rotate\s+\d+', line: 'rotate 4' } # 보관 개수
          - { regexp: '^create$', line: 'create' } # 회전 후 새 파일 생성
          - { regexp: '^su\s+', line: 'su root adm' } # 실행 사용자/그룹
          - { regexp: '^include\s+/etc/logrotate.d', line: 'include /etc/logrotate.d' } # 개별 설정 포함

        #########################################
        # 설치할 자바 버전 (java, package_version_lock 사용)
        # → Kafka 4.0+ 브로커는 Java 17 필수 (KIP-1013) — project_envs 의 JAVA_HOME,
        #   kafka 그룹의 kafka_java_home 과 항상 함께 움직인다
        #########################################
        java_version: "17"

        #########################################
        # 스왑 파일 경로/크기(MB) (enable_swap 사용, 경로는 k8s_master·k8s_worker 스왑 검증에도 사용)
        # → 크기 변경 시 스왑 파일 재생성으로 수렴 (운영 중 변경은 주의)
        #########################################
        swap_file_path: /swap.img
        swap_size_mb: "8192"

        #########################################
        # project 환경변수 / 공통 bash 설정 (bash_common 사용)
        #########################################
        # project 환경변수 파일 경로
        project_conf_path: /etc/project.conf
        # 공통 bash 설정 적용 대상 파일
        bashrc_targets:
          - /root/.bashrc
          - /etc/skel/.bashrc

        # project 환경 변수
        # → zookeeper/hadoop/hive/spark 는 미사용으로 제거됨 (Kafka 는 KRaft 라 zookeeper 불필요)
        # → KAFKA_HOME 은 kafka 그룹의 kafka_home(심볼릭 링크)과 반드시 일치
        project_envs:
          - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          - KAFKA_HOME=/application/kafka
          - PATH=$JAVA_HOME/bin:$KAFKA_HOME/bin:$PATH

    kubernetes:
      children:
        kubernetes_master:
          hosts:
            ap:
        kubernetes_workers:
          hosts:
            s1:
            s2:

      vars:
        #########################################
        # K8s 설치 버전 고정 (containerd, k8s_packages 사용)
        # → 사용 가능 버전 확인: apt-cache madison <패키지>
        #########################################
        kubernetes_version: "1.34" # pkgs.k8s.io 저장소 마이너 버전
        kubernetes_package_version: "1.34.4-1.1" # kubeadm/kubelet/kubectl → kubernetes_version 마이너와 일치해야 함 (k8s_master 템플릿에서도 참조)
        # containerd 와 runc 는 항상 짝으로 움직인다 — 한쪽만 바꾸지 말 것.
        # 어긋나면 containerd 가 커널에 올리는 AppArmor 프로파일이 runc 의 종료 신호를 막아
        # 파드가 Terminating 에서 사라지지 않는다 (Ubuntu 버그 #2065423).
        # ⚠ 버전 변경 후 노드 재부팅 필요 — 프로파일이 파일이 아니라 containerd 바이너리에
        #   내장돼 실행 시 커널에 로드되므로, 패키지만 갈아도 옛 규칙이 커널에 남는다.
        containerd_version: "2.2.1-0ubuntu1~24.04.3" # Ubuntu 24.04 AppArmor signal(DENIED) 버그 수정 포함
        runc_version: "1.3.4-0ubuntu1~24.04.1" # noble-updates — hold 안 걸면 혼자 올라가 짝이 깨진다
        # 파드 샌드박스 이미지 — containerd 기본값과 kubeadm 이 기대하는 값이 같아야 한다
        # (확인: kubeadm config images list | grep pause)
        sandbox_image: "registry.k8s.io/pause:3.10.1"

        #########################################
        # K8s 클러스터 구성 (k8s_master 사용)
        # → init 이후 변경해도 재실행으로 반영되지 않음 (k8s_reset 후 재구축 필요)
        #########################################
        pod_subnet: "10.244.0.0/16" # 노드망(192.168.56.x)과 겹치면 안 됨
        kubernetes_swap_behavior: "LimitedSwap"
        calico_version: "3.30.0"
        node_cidr: "192.168.56.0/24" # Calico IP 자동감지용 (host-only NIC)
        kubernetes_admin_user: "root" # 마스터에서 kubectl 사용할 계정 (.kube/config 배포 대상)

        #########################################
        # HTTP 사설 레지스트리 허용 목록 (containerd 사용)
        # → 이미지 주소의 host:port와 정확히 일치해야 함 (CIDR/대역 매칭 불가)
        # → 변경 시 containerd 롤이 자동 재시작으로 반영
        #########################################
        # ⚠ 여기 값은 이미지 참조 문자열의 host:port 와 '글자 그대로' 같아야 한다.
        #   certs.d/<이 값>/hosts.toml 경로가 그대로 만들어지고, containerd 는 이미지 주소를
        #   문자열로 매칭한다 — data-layer-harbor 로 pull 하는데 항목이 IP 로 돼 있으면
        #   hosts.toml 이 무시되어 "server gave HTTP response to HTTPS client" 로 실패한다.
        containerd_insecure_registries:
          # data_layer_vip_dns_names 변수를 끌어쓰지 않고 문자열을 그대로 적는 이유:
          # 이 값은 certs.d/<이 값>/hosts.toml 디렉토리 이름이 되므로 이미지 주소와
          # 글자 그대로 같아야 하고, 목록 중 '레지스트리인 이름'은 Harbor 하나뿐이라
          # 인덱스로 참조하면 목록 순서가 바뀔 때 조용히 엉뚱한 이름이 박힌다.
          - "data-layer-harbor" # Harbor (TLS 미사용 → HTTP 접속 허용)
          # ⚠ IP 진단용 예비 항목을 두지 않는다. 인그레스는 Host 헤더로 목적지를 고르는데
          #   IP 로 직접 치면 그 헤더가 IP 라서 어떤 규칙에도 걸리지 않고 404 가 된다.
          #   즉 "이름이 안 풀릴 때 IP 로 우회"가 인그레스 구조에서는 성립하지 않는다.
          #   이름 해석이 의심되면 certs.d 가 아니라 /etc/hosts 와 VIP(ARP)를 먼저 본다.

        #########################################
        # 필수 Ansible 컬렉션 (collection_check 사용)
        #########################################
        required_collections:
          - ansible.posix # sysctl 모듈 (k8s_prereq)
          - community.general # modprobe 모듈 (k8s_prereq)

    longhorn:
      hosts:
        ap:
        s1:
        s2:

      vars:
        #########################################
        # Longhorn 노드 사전 준비 (longhorn_prereq 사용)
        # → 사용 가능 버전 확인: apt-cache madison open-iscsi
        #########################################
        open_iscsi_version: "2.1.9-3ubuntu4" # noble 기본 아카이브 버전
        longhorn_data_path: /data/longhorn # Longhorn 설치 시 defaultDataPath와 일치시켜야 함

    local_git:
      hosts:
        s2: # data_pipeline 소스 트리가 있는 유일한 노드

      vars:
        #########################################
        # Airflow 코드 저장소 부트스트랩 (local_git 사용)
        # → 서버 쪽 bare 저장소는 Terraform 303-git 이 만든다. 여기는 클라이언트 쪽뿐이다.
        # → 이 롤은 '한 번 만들어 주는 것'까지만 한다 — 커밋이 이미 있으면 건드리지 않는다.
        #########################################
        local_git_repo_dir: /my_project/data_pipeline/data_layer_airflow
        # ⚠ 주소·브랜치는 Terraform 304-airflow 의 git_repo / git_ref 와 짝이다.
        #   여기는 NodePort(바깥에서 push), 파드는 ClusterIP FQDN(안에서 clone) — 같은 저장소다.
        local_git_remote_url: "git://data-layer-git:30418/airflow.git"
        local_git_branch: master

        local_git_user_name: ops
        local_git_user_email: ops@data-layer

        local_git_initial_message: "init: airflow DAG + 커스텀 패키지 (git-sync 원본)"

        # ⚠ 앞의 두 줄은 비밀값이라 반드시 제외한다(비밀번호·fernet·JWT·CRYPTO_KEY).
        #   런타임 값은 Secret airflow-env 에서 오므로 저장소에 없어도 동작한다.
        local_git_ignore:
          - airflow.env
          - scripts/airflow.conf
          - logs/
          - __pycache__/
          - "*.pyc"

    terraform:
      hosts:
        s2:

      vars:
        #########################################
        # Terraform 설치 버전 고정 (terraform 사용)
        # → 사용 가능 버전 확인: apt-cache madison terraform (저장소 등록 후)
        #########################################
        terraform_version: "1.15.8-1" # HashiCorp apt 패키지 버전
        hashicorp_repo_release: "noble" # HashiCorp apt 저장소 suites (Ubuntu 코드네임)

    docker:
      hosts:
        ap:
        s1:
        s2:

      vars:
        #########################################
        # Docker 설치 버전 고정 (docker 사용)
        # → 사용 가능 버전 확인: apt-cache madison docker.io docker-compose-v2
        # → docker-ce(containerd.io)는 K8s용 containerd 패키지와 충돌 → Ubuntu 아카이브 docker.io 사용
        #########################################
        docker_version: "29.1.3-0ubuntu3~24.04.2" # noble-updates 아카이브 버전
        docker_compose_version: "2.40.3+ds1-0ubuntu1~24.04.1" # docker compose 플러그인 (docker-compose-v2)

        #########################################
        # docker 그룹 추가 대상 계정 (docker 사용)
        # → sudo 없이 docker 사용 (적용은 재로그인 후)
        #########################################
        docker_users:
          - jsy_project

    kafka:
      hosts:
        ap:
          kafka_node_id: 0 # KRaft node.id — 기존 K8s StatefulSet ordinal(kafka-0/1/2) 승계
        s1:
          kafka_node_id: 1
        s2:
          kafka_node_id: 2

      vars:
        #########################################
        # Kafka 설치 버전 고정 (kafka 사용)
        # → ADR 0: 브로커는 K8s 가 아니라 로컬(systemd) 설치 — 로컬 디스크 I/O,
        #   짧은 네트워크 경로, Kafka 자체 HA(RF=3)가 이유. K8s 에는 kafka-ui/
        #   schema-registry/kafka-exporter 만 남는다(Terraform 301-kafka-tools).
        # → 사용 가능 버전 확인: https://archive.apache.org/dist/kafka/
        # → ⚠ Kafka 4.0+ 브로커는 Java 17 필수 — Ubuntu_Servers 의 java_version 과 함께 관리
        #########################################
        kafka_version: "4.0.1" # 기존 K8s 브로커 이미지(apache/kafka:4.0.1)와 동일
        kafka_scala_version: "2.13" # 배포판 스칼라 버전 (4.0.x 는 2.13 만 제공)
        kafka_jmx_exporter_version: "1.0.1" # JMX Prometheus javaagent (기존 이미지와 동일)

        #########################################
        # 설치 경로 / 실행 계정 (kafka 사용)
        # → kafka_home 은 심볼릭 링크(실체는 kafka_<스칼라>-<버전>) —
        #   project_envs 의 KAFKA_HOME 과 반드시 일치
        # → kafka_java_home 은 java 롤이 설치한 JDK 경로 조립 — project_envs 의 JAVA_HOME 과 동일
        #########################################
        kafka_install_root: /application
        kafka_home: /application/kafka
        kafka_data_dir: /data/kafka # 로그 세그먼트(브로커 데이터) — 로컬 디스크 직접 사용
        kafka_log_dir: /logs/kafka # 브로커 애플리케이션 로그 (LOG_DIR)
        kafka_user: kafka # 로그인 불가 시스템 계정
        kafka_java_home: "/usr/lib/jvm/java-{{ java_version }}-openjdk-amd64"

        #########################################
        # KRaft 클러스터 구성 (kafka 사용)
        # → CLUSTER_ID 는 최초 포맷 시 각인 — K8s 시절 값 승계, 전 노드 동일해야 함
        # → 포트 계약: 9092 클라이언트 / 9093 브로커간 / 9094 컨트롤러 / 9404 JMX 메트릭.
        #   바꾸면 Terraform 300-data-layer-base 의 kafka_bootstrap_servers,
        #   302-monitoring 의 kafka_jmx_targets 도 반드시 함께 고칠 것
        # → ⚠ JMX 포트는 노드에서 이미 쓰는 포트를 절대 피할 것. javaagent 는 premain 에서
        #   바인드에 실패하면 JVM 자체를 종료시켜 브로커가 크래시 루프에 빠진다.
        #   K8s 시절 9098 을 쓰다가 이관 후 Calico Typha(127.0.0.1:9098)와 충돌해 옮겼다
        #   — 파드일 때는 파드 네트워크라 안 겹쳤지만 로컬 설치는 노드 포트를 직접 쓴다.
        #   (노드 점유 현황: calico-typha 9098 / calico-node 9099 / alloy 12345)
        #########################################
        kafka_cluster_id: "HX65iPPZTWOoFe5w-Od0Sw"
        kafka_client_port: "9092"
        kafka_internal_port: "9093"
        kafka_controller_port: "9094"
        kafka_jmx_port: "9404" # JMX exporter (Kafka 생태계 관례 포트)

        #########################################
        # 복제/파티션 기본값 (kafka 사용)
        # → min ISR 1 = 브로커 2대가 죽어도 쓰기 지속 (내구성 ↔ 가용성 트레이드오프)
        #########################################
        kafka_replication_factor: "3"
        kafka_min_isr: "1"
        kafka_num_partitions: "3" # --partitions 없이 만들어진 토픽의 안전망

        #########################################
        # 토픽 프로비저닝 (kafka_topics 사용)
        # → ⚠ 파티션 수는 운영 중 변경 금지 — 프로듀서가 hash(key) % PARTITIONS 로
        #   파티션을 고르므로 바꾸면 같은 키의 순서 보장이 깨진다
        #########################################
        kafka_topic_partitions: "3"
        kafka_topic_list:
          # raw — 수집기가 적재 (Airflow 배치 SFTP/PROCEDURE · TCP socket push · Debezium CDC)
          - raw.qm.qm-chemical.batches
          - raw.qm.qm-chemical.qc-results
          - raw.qm.qm-chemical.event-logs
          - raw.qm.qm-chemical.replacement-history
          - raw.qm.qm-chemical.control-loop-defs
          - raw.qm.qm-chemical.claims
          - raw.qm.qm-chemical.lab-results
          - raw.qm.qm-chemical.sensor-timeseries
          # 파이프라인 내부 (cdm / dlq / lineage)
          - cdm-topic
          - dlq-cdm-topic
          - dlq-cdm-consumer-rdb
          - dlq-cdm-consumer-graph
          - dlq-cdm-consumer-warehouse
          - dlq.raw
          - lineage-topic
          - dlq-lineage

    postgres:
      hosts:
        ap:

      vars:
        #########################################
        # PostgreSQL 설치 버전 고정 (postgres 사용)
        # → ADR 0(Kafka)의 판단을 데이터 스토어에도 적용 — K8s 가 아니라 로컬(systemd).
        #   단일 인스턴스라 재스케줄 이득이 없고, 로컬 디스크 I/O 가 곧 성능이다.
        # → 사용 가능 버전 확인: apt-cache madison postgresql-16
        # → TimescaleDB 는 packagecloud 저장소 — 확장과 loader 가 세트로 같은 버전이어야 한다.
        #   목록 확인: https://packagecloud.io/timescale/timescaledb/ubuntu/dists/noble/main/binary-amd64/Packages
        #########################################
        postgres_version: "16" # Ubuntu noble 아카이브가 제공하는 유일한 메이저
        postgres_package_version: "16.14-0ubuntu0.24.04.1" # noble-updates
        timescaledb_version: "2.29.0~ubuntu24.04-1614"
        timescaledb_tools_version: "0.19.0~ubuntu24.04"
        timescale_repo_release: "noble" # packagecloud suites (Ubuntu 코드네임)

        #########################################
        # 서버 설정 (postgres 사용)
        # → listen_addresses 는 '*' 여야 한다: 클러스터 파드가 Service DNS 없이
        #   노드 IP 로 직접 붙는다(로컬 설치라 Service 가 없다).
        # → 포트를 바꾸면 Terraform 300-data-layer-base 의 postgres_port,
        #   304-airflow 의 postgres_port 도 반드시 함께 고칠 것.
        # → 데이터 디렉토리는 배포판 기본값(/var/lib/postgresql/16/main)을 그대로 쓴다.
        #   옮기려면 pg_dropcluster/pg_createcluster 가 필요해 별도 결정 사항으로 남긴다.
        #########################################
        postgres_port: "5432"
        postgres_listen_addresses: "*"
        postgres_max_connections: "200" # 랩 규모 — 파드 수 대비 여유
        postgres_timezone: "Asia/Seoul" # airflow 스택(AIRFLOW__CORE__DEFAULT_TIMEZONE)과 일치

        #########################################
        # 통일 계정 (postgres 사용)
        # → compose 의 POSTGRES_USER 이자 COLLECTOR_DB_USER 다 — 하나로 통일된 계약.
        # → ⚠ Terraform 300-data-layer-base 와 304-airflow 의 secrets.auto.tfvars
        #   postgres_user / postgres_password 와 **글자 그대로** 같아야 한다.
        #   갈리면 airflow init Job 이 db check 에서 5분씩 7회 재시도 후 죽는다.
        #########################################
        postgres_superuser: "data_layer"
        postgres_superuser_password: "data_layer123!"

        #########################################
        # DB 3종 (postgres 사용)
        # → 이 인스턴스 하나가 셋을 담는다(compose 시절 계약 승계).
        # → collector_db_schema 는 300-data-layer-base 의 collector_db_schema 와 같아야 한다.
        #########################################
        airflow_db_name: "airflow" # Airflow 메타DB (304-airflow 의 airflow_db_name)
        collector_db_name: "data_layer" # collect_job / realtime_source / data_lineage
        collector_db_schema: "data_pipeline"
        iceberg_catalog_db_name: "iceberg_catalog" # pyiceberg SqlCatalog 메타데이터
        postgres_databases:
          - airflow
          - data_layer
          - iceberg_catalog

    minio:
      hosts:
        ap:

      vars:
        #########################################
        # MinIO 설치 버전 고정 (minio 사용)
        # → ⚠ latest 경로가 아니라 archive/<태그> 를 받는다(버전 고정 규칙).
        #   최신 릴리스가 archive/ 에 아직 없을 수 있으므로 핀을 올리기 전에 실존 확인:
        #     curl -sIL https://dl.min.io/server/minio/release/linux-amd64/archive/minio.<태그> | head -1
        # → compose 시절 4노드 분산이었으나 로컬 이관과 함께 단일 노드/단일 디스크(SNSD)로
        #   정리됐다. 이레이저 코딩이 없다 — 디스크가 죽으면 오브젝트가 사라진다(랩 트레이드오프).
        #########################################
        minio_version: "RELEASE.2025-09-07T16-13-09Z"
        minio_mc_version: "RELEASE.2025-08-13T08-35-41Z"

        #########################################
        # 설치 경로 / 실행 계정 (minio 사용)
        #########################################
        minio_install_root: /application/minio
        minio_data_dir: /data/minio # 오브젝트 데이터 — 로컬 디스크 직접 사용
        minio_seed_dir: /data/minio-seed # 시드 스테이징(컨트롤 노드에서 복사 → mc mirror)
        minio_user: minio # 로그인 불가 시스템 계정

        #########################################
        # 포트 / 자격증명 (minio 사용)
        # → 포트를 바꾸면 300-data-layer-base 의 minio_endpoint 와
        #   304-airflow 의 minio_endpoint 도 반드시 함께 고칠 것.
        # → ⚠ 자격증명은 300-data-layer-base 의 minio_root_user / minio_root_password 와
        #   같아야 한다(304-airflow 는 같은 값을 minio_access_key/secret_key 로 받는다).
        #########################################
        minio_api_port: "9000" # S3 API
        minio_console_port: "9001" # 웹 콘솔
        minio_root_user: "data_layer"
        minio_root_password: "data_layer123!"
        minio_mc_alias: "dl"

        #########################################
        # 버킷 프로비저닝 (minio 사용) — compose 의 minio-init 승계
        # → config    : 도메인 설정/스키마/커넥터 JSON (CDM_OBJSTORE_BUCKET)
        # → warehouse : Iceberg 데이터 파일 (ICEBERG_WAREHOUSE)
        # → airflow-logs : Airflow 원격 로깅 (304-airflow 의 airflow_logs_bucket)
        #   ⚠ 없으면 Airflow 태스크는 정상 종료해도 로그가 사라진다(업로드 실패가 태스크를 죽이지 않는다).
        # → minio_seed_src 는 컨트롤 노드의 data_pipeline 저장소 경로다(시드 원본).
        #########################################
        minio_config_bucket: "config"
        minio_buckets:
          - config
          - warehouse
          - airflow-logs
        minio_seed_src: /my_project/data_pipeline

    neo4j:
      hosts:
        ap:

      vars:
        #########################################
        # Neo4j 설치 버전 고정 (neo4j 사용)
        # → ADR 0(Kafka)의 판단을 데이터 스토어에도 적용 — K8s 가 아니라 로컬(systemd).
        #   compose 의 data_layer-graph(neo4j:5-community 이미지)를 대체한다.
        # → 5.26 은 5.x LTS 라인이다. 6.x 로 올리려면 neo4j_repo_component 도 함께 바꿔야 한다.
        # → 사용 가능 버전 확인:
        #     curl -s https://debian.neo4j.com/dists/stable/5/binary-amd64/Packages \
        #       | awk '/^Package: /{p=$2} /^Version: /{if(p=="neo4j") print $2}' | sort -V | tail
        # → ⚠ epoch(`1:`)까지 적어야 한다 — 빼면 apt 가 그런 버전이 없다며 실패한다.
        # → ⚠ 마이너 업그레이드도 스토어 포맷을 올려 되돌릴 수 없다(하위 버전이 못 연다).
        #   핀을 올리기 전에 데이터 백업 여부를 먼저 판단할 것.
        #########################################
        neo4j_package_version: "1:5.26.28" # neo4j / cypher-shell 공통
        neo4j_repo_suite: "stable" # deb https://debian.neo4j.com stable 5
        neo4j_repo_component: "5" # 메이저 계열 = 저장소 component

        #########################################
        # 실행 환경 / 경로 (neo4j 사용)
        # → neo4j_home 은 패키지가 쓰는 NEO4J_HOME 이다(/usr/bin/neo4j 래퍼가 박아 넣는 값).
        #   데이터는 그 아래 data/ 로, 배포판 기본값(server.directories.data)을 그대로 쓴다.
        #   postgres 롤과 같은 판단 — 옮기려면 stop→이동→설정 변경이 세트라 별도 결정 사항이다.
        # → neo4j_java_home 은 java 롤이 설치한 JDK 경로 조립 — Kafka 와 같은 JDK 를 쓴다.
        #   ⚠ Neo4j 5 는 Java 17 이상 필수(패키지 의존성 java17-runtime|jdk-17) →
        #     Ubuntu_Servers 의 java_version 과 항상 함께 움직인다.
        #########################################
        neo4j_home: /var/lib/neo4j # NEO4J_HOME (데이터는 이 아래 data/)
        neo4j_conf_file: /etc/neo4j/neo4j.conf
        neo4j_service_user: neo4j # 패키지 postinst 가 만드는 시스템 계정
        neo4j_java_home: "/usr/lib/jvm/java-{{ java_version }}-openjdk-amd64"

        #########################################
        # 포트 / 접속 계약 (neo4j 사용)
        # → 포트 계약: 7687 Bolt(드라이버) / 7474 HTTP(Neo4j Browser).
        #   바꾸면 Terraform 300-data-layer-base 의 neo4j_bolt_uri 도 반드시 함께 고칠 것.
        # → Community Edition 은 DB 가 `neo4j` 하나뿐이다 — 기존 그래프와의 분리는 DB 가
        #   아니라 라벨 접두어(300 스택의 graph_label_prefix)로 한다.
        # → ⚠ 계정/비밀번호는 300-data-layer-base 의 secrets.auto.tfvars
        #   platform_neo4j_user / platform_neo4j_password 와 **글자 그대로** 같아야 한다.
        #   갈리면 서버는 멀쩡한데 cdm-consumer-graph 만 조용히 인증 실패한다.
        #   (data_pipeline/.env 의 dsai-neo4j 는 compose 시절 값이다 — 계약은 Terraform 쪽)
        # → ⚠ 비밀번호는 최초 기동 전에 1회 각인된다. 나중에 이 값을 바꿔도 재실행으로는
        #   반영되지 않는다 — cypher-shell 로 ALTER USER 를 직접 실행해야 한다.
        #########################################
        neo4j_bolt_port: "7687"
        neo4j_http_port: "7474"
        neo4j_database: "neo4j"
        neo4j_user: "neo4j"
        neo4j_password: "datalayer-neo4j"

        #########################################
        # 메모리 (neo4j 사용)
        # → compose 의 GRAPH_DB_HEAP_MAX / GRAPH_DB_PAGECACHE 계약 승계.
        # → ⚠ ap 는 이미 Kafka 브로커(JVM) · PostgreSQL · MinIO · K8s 컨트롤플레인을
        #   함께 지고 있다. 힙 1G + 페이지캐시 512M 는 이 노드 단일 최대 소비자다 —
        #   파드가 Pending/OOM 으로 밀리면 여기부터 512M/256M 로 내리는 것이 첫 수다.
        # → 힙은 롤에서 initial=max 로 같이 박는다(가변 힙은 GC 중 재조정으로 지연이 튄다).
        #########################################
        neo4j_heap_size: "1G"
        neo4j_pagecache_size: "512M"
